name: Merge notification

# Fires when a PR is merged into main and posts a summary to the team channel,
# so people who never open the repo still hear what landed.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Pin to the commit the merge actually produced. The default for a
      # pull_request event is refs/pull/N/merge, which is a pre-merge preview and
      # can carry an older copy of these scripts from the PR branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post merge summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/notify.mjs
