name: Refresh context

# Reads context-manifest.yaml, pulls each source that declares a summarize_to,
# summarizes it, writes the result into team/_generated/ and opens a PR.
#
# A PR rather than a direct commit, on purpose. The pipeline proposes; a person
# confirms. That is the same rule /refresh-index follows, and it is what keeps a
# bad summary from quietly becoming the team's context.
#
# Every run also appends an entry to team/_generated/refresh-log.md, so the PR
# carries the record of the run even when no summary moved.

on:
  # The Monday cron is off on purpose. ANTHROPIC_API_KEY is deliberately NOT in this
  # repo's secrets — it is public, and any collaborator who can push a workflow can read
  # a secret out of one. So the summarize step runs locally, where the key stays in the
  # operator's own environment, and this workflow is dispatch-only. See
  # team/_generated/README.md → Running it. Re-enable the cron only alongside a
  # credential that is safe to store here (a scoped key, or OIDC federation).
  #
  # schedule:
  #   - cron: '0 6 * * 1' # Mondays, 06:00 UTC — before the weekly update goes out
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report, but do not summarize, write or log'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The script is the thing that decides what gets written into the repo, so it
      # runs against its own tests before it runs against the manifest.
      - name: Test
        run: node --test .github/scripts/*.test.mjs

      - name: Resolve pointers and summarize
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node .github/scripts/refresh-context.mjs \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee refresh-report.txt

      # `!cancelled()` and not `success()`, deliberately. The step above exits non-zero
      # when any source failed, and a job that goes red is the right signal — but one
      # unreachable source must not suppress the summaries that did refresh, or the log
      # entry recording that the run happened. A run nobody hears about is the failure
      # this whole pipeline exists to prevent.
      - name: Open a PR with what changed and the run log
        if: ${{ !cancelled() && steps.refresh.outputs.changed == 'true' && !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: context/refresh
          title: 'Refresh generated context'
          commit-message: 'chore: refresh generated context from manifest sources'
          body-path: refresh-report.txt
          delete-branch: true
          labels: context
