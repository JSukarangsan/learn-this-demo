# context-manifest.yaml — where this team's sources of truth actually live.
#
# This is the addressing layer, not a source of truth. Locations and status only,
# never content. The moment a summary gets pasted in here there are two copies of it
# and no way to tell which one is wrong.
#
# EVERY ENTRY IS ONE OF TWO THINGS, and the test is whether it names a file in this repo.
#
#   Cached      the entry names a path, so a copy exists here. `refresh:` says how often
#               it gets rebuilt. A pipeline writes `summarize_to`; a person writes
#               `copy_of_record` when there is no API to automate. Both are caches.
#               Cache a source when its truth holds for months. The planning doc, the
#               OKRs, how the team works.
#
#   Pointed at  no path, so no copy, so no `refresh:` and nothing to go stale. Read the
#               source. This is the right answer for anything that changes faster than
#               anyone would rewrite a summary: the backlog, the design file.
#
# For a pointed-at source this file records HOW TO READ IT, never what it says. A note
# about how frames are named belongs here and stays true for years. The frames do not.
#
# There is no third option. If you are tempted to cache the backlog because it feels like
# capturing context, the copy is wrong within a week and nobody can tell which version is.
#
# Entries with a `summarize_to` are rebuilt by .github/workflows/refresh-context.yml into
# team/_generated/, as a PR and never a direct commit. Everything else is confirmed by a
# person.
#
# THE DATES IN THIS FILE DO NOT REFRESH THEMSELVES. Someone reads these entries and updates
# last_confirmed — about fifteen minutes a month, and it is the first thing here to go
# stale. `/refresh-index` checks each pointer and proposes the edit; a person still
# confirms it. The version that watches sources on its own does not exist yet.

team: webapp
full_name: "Learn.this — Webapp team"

# What an agent should know before pulling anything.
quick_context: |
  We own the learner-facing web app: catalog, enrollment, the live session experience.
  Six people. Next.js on Vercel, Postgres behind the enrollment and billing services.
  Four learner states — anonymous, self-serve, assigned, lapsed — and most of the
  confusion in this product traces to someone forgetting one of them.

sources:
  product_backlog:
    canonical: "https://summerfriday-team.atlassian.net/jira/software/projects/SCRUM/boards/1"
    type: jira_project
    project_key: "SCRUM" # the project is named Learn.This Webapp Team; the key is Jira's default
    owner: "Webapp PM"
    reachable: true # via the Atlassian MCP
    last_confirmed: 2026-08-16
    notes: >
      Scope of record, and deliberately not a file in this repo. Requirements move
      faster than anyone will hand-copy into markdown, so a copy would be wrong within
      a week and nobody would know which version was real. /build-update reads it live.
      The arrow only points one way — we know about the tracker, it knows nothing
      about us. What this repo holds that the tracker doesn't is product/decisions/,
      which says *why* scope is what it is.
      Blocked comes from the issue link and nothing else. A summary that reads like a
      blocker is not one.
    supersedes: >
      A Notion database held this until 2026-08-15
      (app.notion.com/p/3b3a901bd57d8146a6b6d48f1abdb851). It moved because the tracked
      work belongs in the tracker the team already uses, and a demo that reaches past it
      argues against itself. /weekly-digest still reads the Notion copy and has not been
      repointed — two skills reading two different backlogs is a real inconsistency, not
      a transitional state to leave alone.

  team_chat:
    canonical: "#webapp, in the team's Slack workspace"
    type: slack_channel
    demo_channel: "#demo-learn-this — a private channel standing in for #webapp for this
      kit, so a rehearsal doesn't post fictional chatter somewhere real colleagues would
      see it"
    owner: "Webapp team"
    reachable: true # via the Slack MCP
    direction: "read and write — the only source that's also a destination"
    last_confirmed: 2026-08-17
    notes: >
      Where a decision gets re-litigated informally before — or instead of — anyone
      writing it up. /weekly-digest-expanded reads it for exactly one thing: a
      conversation that treats something as settled when the tracker and the decision
      log don't agree it is. A message here is evidence of what was said, never of what
      was decided. Nothing in this channel can produce a Decided line.
      It's also where the skill posts its own notification once the Sheet write
      succeeds — see outputs.weekly_digest_tracker. Read and write happen in the same
      channel but are not the same permission: reading needs channel history, posting
      the notification needs chat:write. Losing one doesn't cost you the other.
    reachability_note: >
      This demo posts the mock conversation under one identity with speaker names inline
      in the message text, not as distinct Slack users — reading multiple named voices
      out of a channel does not require the posters to be real, separate accounts. Most
      teams can reach a channel's history with a normal read scope; posting as visibly
      distinct people needs chat:write.customize and is a heavier ask than this kit
      assumes by default. The notification the skill itself posts is a normal chat:write
      message and doesn't need that scope.

  product_ui:
    canonical: "https://www.figma.com/design/YA4IogBXflpPsX5HEAm78o"
    type: figma
    owner: "Ines Okafor (Design)"
    reachable: true # via Figma MCP
    last_confirmed: 2026-08-05
    notes: >
      Design system and product UI. Frames are named `Screen / viewport / state`.
      Pulled live rather than summarized — visual state doesn't survive being
      described in prose.

  h2_planning:
    canonical: "https://docs.google.com/document/d/17ClPEZBETde-TQIMvdRYx3BhShulGq1_CctRZi23sLA"
    type: google_doc
    owner: "VP Product — not this team"
    reachable: true
    fetch: "https://docs.google.com/document/d/17ClPEZBETde-TQIMvdRYx3BhShulGq1_CctRZi23sLA/export?format=txt"
    refresh: quarterly
    summarize_to: team/_generated/h2-planning.md
    last_confirmed: 2026-08-05
    notes: >
      Authored a level up. team/charter.md and team/goals-and-okrs.md are summaries of
      it. Regenerate rather than editing in place — maintaining a second copy of somebody
      else's document is a race you lose.
    reachability_note: >
      This demo fetches the doc directly, because it is link-shared and fiction. Most
      teams cannot do that: Drive MCP and the Workspace CLI are not authorised for
      everyone, and a real planning doc would not be link-shared anyway. Glean is the
      path that works from inside the company, and it is covered in a later session.

  cohort_calendar:
    canonical: "https://docs.google.com/spreadsheets/d/1kk1rRAH5h2ze7S6iKIEh8qHzws8lcyNdlMny4WbfAl8"
    type: google_sheet
    owner: "Priyanka (Ops)"
    reachable: true
    fetch: "https://docs.google.com/spreadsheets/d/1kk1rRAH5h2ze7S6iKIEh8qHzws8lcyNdlMny4WbfAl8/export?format=csv"
    refresh: weekly
    summarize_to: team/_generated/cohort-calendar.md
    last_confirmed: 2026-08-05
    notes: >
      The floor on time-to-first-session is set here, not by anything we ship. Check it
      before investigating a move in that metric — most investigations should end in the
      first ten minutes with "it's the calendar."
    reachability_note: >
      Same caveat as h2_planning — direct fetch works here because it is link-shared
      fiction. Glean is the route that works inside the company.

  instructor_nps:
    canonical: "https://app.notion.com/p/3b3a901bd57d819b91ddf531a047463f"
    type: notion_page
    owner: "Insights"
    reachable: true # via Notion MCP
    refresh: quarterly
    summarize_to: team/_generated/instructor-nps.md
    last_confirmed: 2026-08-05
    notes: >
      Raw read only. What any of it means is arbitrated in insights/definitions.md, which
      lives in this repo — the survey does not get to define the metric.

  vendor_video_sla:
    canonical: "vendor portal, SSO only — no API"
    type: vendor_portal
    owner: "Tobias Ferro (Eng)"
    reachable: false
    workaround: "Export quarterly into insights/. That export is the copy of record."
    copy_of_record: insights/vendor-video-sla-2026-q3.md
    refresh: quarterly
    last_confirmed: 2026-08-04
    notes: >
      Unreachable, but not unimportant — so a person exports it by hand and the export is
      authoritative. Never summarize this one from upstream; there is no upstream to
      reach. /refresh-index should check the export's date, not the portal.

  contract_terms:
    canonical: "Legal, counsel only"
    type: restricted
    owner: "Legal"
    reachable: false
    deliberate: true
    notes: >
      Canonical, unreachable, and correctly so. Some material should stay where it is.
      Writing down that it exists, that it's authoritative, and that we are deliberately
      not making it reachable is a finished answer, not a to-do — and an agent that
      knows this is better than one that goes looking. /refresh-index must never report
      this as drift.

# Where /weekly-digest-expanded writes, not reads from. Same addressing-layer rule
# applies: an ID here, never a copy of what the doc currently says.
outputs:
  weekly_digest_doc:
    canonical: "https://docs.google.com/document/d/1J8aEG9WAov0xSIehqsopUHHJTu6bNE4F2pbzPbr2nAw"
    type: google_doc
    write_mode: replace # current-state doc, not a log — see SKILL.md for the mechanism
    written_by: "/weekly-digest-expanded"
    last_written: 2026-08-18

  weekly_digest_tracker:
    canonical: "https://docs.google.com/spreadsheets/d/14xv-ZWVQ1A9nqy1ral6sFns8XOeiRB7EAO7kZ3f2Ujo"
    type: google_sheet
    tabs: ["Key Decisions", "Risk Log"]
    write_mode: append_only # this is the historical log — a full-range write here
      # destroys every prior week's rows. 11 rows in Key Decisions, 9 in Risk Log as of
      # last_written; both counts should only ever go up.
    written_by: "/weekly-digest-expanded"
    last_written: 2026-08-18
    reachability_note: >
      This demo writes both outputs over the gws CLI under Jon's own external-consultant
      Google account, which carries full Docs/Sheets scopes. That is not what most teams
      inside a company have — Drive MCP and the Workspace CLI are not authorised for
      everyone, same caveat as h2_planning above. What this shows is the write-back half
      of the loop working end to end once that access exists, not that it is universally
      reachable today.

# Written here and nowhere else. No upstream to point at, because this repo is the
# system of record for them.
local:
  - product/decisions/ # why scope is what it is. The backlog says what, not why.
  - product/glossary.md
  - engineering/constraints.md
  - design/CLAUDE.md
  - insights/definitions.md
  - team/ownership.md

# What a tool can actually reach from here today.
available_connections:
  - jira # the tracked work
  - notion # the NPS page
  - figma # the UI
  - google_drive # planning doc and ops calendar, fetched over link-shared export URLs
  - slack # #demo-learn-this, read-only — /weekly-digest-expanded
  - google_docs_write, google_sheets_write # /weekly-digest-expanded's outputs, over gws
    # CLI under Jon's own account — see outputs.weekly_digest_tracker.reachability_note
  # vendor portal: SSO only, no API
  # legal: deliberately not connected
